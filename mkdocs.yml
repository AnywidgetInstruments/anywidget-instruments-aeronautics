site_name: anywidget-instruments-aeronautics
site_description: Flight instruments for computational notebooks
site_url: https://anywidgetinstruments.github.io/anywidget-instruments-aeronautics/
repo_url: https://github.com/AnywidgetInstruments/anywidget-instruments-aeronautics
edit_uri: ""
# Buildable offline — no Google Fonts, no CDN assets, as the other sites of the family.
theme:
  name: material
  font: false
  features:
    - navigation.sections
    - content.code.copy
  # System preference by default; the toggle cycles light, dark, system.
  palette:
    - media: "(prefers-color-scheme)"
      toggle: { icon: material/brightness-auto, name: Switch to light mode }
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-sunny, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-night, name: Switch to system preference }
nav:
  - Home: index.md
  - Widget catalog: widgets.md
  - Try it in the browser: try.md
  - Safety notice: safety.md
  - Standards and references: standards.md
  - Specification: specification.md
  - Requirements status: requirements-status.md
markdown_extensions:
  - tables
  - admonition
  - attr_list
