# Documentation site, published to GitHub Pages as the other sites of the family,
# with the in-browser demos (marimo WebAssembly) running the wheels built here: of
# this library, and of the anywidget-instruments core at the commit the front end is
# built against.
name: Docs

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wheels of the anywidget-instruments core and of this library
        run: |
          pip install build uv # uv: import analysis of the marimo export
          sha=$(node -p "require('./package.json').devDependencies['anywidget-instruments'].split('#')[1]")
          pip wheel --no-deps -w dist "anywidget-instruments @ git+https://github.com/AnywidgetInstruments/anywidget-instruments@$sha"
          pip install dist/anywidget_instruments-*.whl
          python -m build --wheel -o dist
          pip install -e ".[docs]" marimo
      - name: The wheel ships the bundle, the contract and the schemas
        run: |
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/anywidget_instruments_aeronautics-*.whl")[0]).namelist()
          for needed in ("static/index.js", "static/index.css", "static/contract.json", "schema/altimeter.schema.json"):
              assert any(n.endswith("anywidget_instruments_aeronautics/" + needed) for n in names), needed
          PY
      - name: MkDocs (offline-capable, strict)
        run: mkdocs build --strict -d site
      - name: marimo WebAssembly exports with both wheels
        run: |
          mkdir -p lite/marimo/public
          cp dist/*.whl lite/marimo/public/
          # the core first: this library depends on it (one ls each: ls sorts by locale)
          (cd dist && ls anywidget_instruments-*.whl && ls anywidget_instruments_aeronautics-*.whl) > lite/marimo/public/wheels.txt
          for nb in lite/marimo/*.py; do
            name=$(basename "$nb" .py)
            marimo export html-wasm "$nb" -o "site/marimo/$name" --mode run --show-code
            rm -f "site/marimo/$name/CLAUDE.md"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
