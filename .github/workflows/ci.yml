# Front end and Python host binding, built and tested the way the other
# libraries of the family are.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Type check (contract generated from the schemas)
        run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Bundle size budget (150 kB gzipped, as anywidget-instruments)
        run: |
          size=$(cat src/anywidget_instruments_aeronautics/static/index.js src/anywidget_instruments_aeronautics/static/index.css | gzip -9 | wc -c)
          echo "bundle: $size bytes gzipped"
          test "$size" -le 153600
      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: src/anywidget_instruments_aeronautics/static/

  python:
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: src/anywidget_instruments_aeronautics/static/
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4 # reads the commit of the core in package.json
        with:
          node-version: 22
      - name: The anywidget-instruments core, at the commit the front end is built against
        run: pip install "anywidget-instruments @ git+https://github.com/AnywidgetInstruments/anywidget-instruments@$(node -p "require('./package.json').devDependencies['anywidget-instruments'].split('#')[1]")"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest
