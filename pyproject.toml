[build-system]
requires = ["hatchling", "hatch-jupyter-builder>=0.8"]
build-backend = "hatchling.build"

[project]
name = "anywidget-instruments-aeronautics"
version = "0.1.0.dev0"
description = "Flight instruments (airspeed, attitude, altimeter, turn coordinator, heading, vertical speed) for computational notebooks, built on the anywidget-instruments core."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Sébastien Celles" }]
keywords = ["anywidget", "jupyter", "marimo", "aviation", "flight-instruments", "widgets"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Framework :: Jupyter",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Visualization",
]
# The widgets derive from the anywidget-instruments core (GEN-001, GEN-006). It is
# not on the package index yet: install it first from its repository, at the
# commit the front end is built against (package.json), as the CI workflow does.
dependencies = ["anywidget-instruments", "anywidget>=0.9", "traitlets>=5.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.18", "ruff>=0.6", "mypy>=1.10"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5"]

[project.urls]
Homepage = "https://github.com/AnywidgetInstruments/anywidget-instruments-aeronautics"
Issues = "https://github.com/AnywidgetInstruments/anywidget-instruments-aeronautics/issues"
Documentation = "https://anywidgetinstruments.github.io/anywidget-instruments-aeronautics/"

[tool.hatch.build]
only-packages = true
# data directories are not Python packages: only-packages would leave them out
artifacts = [
  "src/anywidget_instruments_aeronautics/static/*",
  "src/anywidget_instruments_aeronautics/schema/*.json",
]

[tool.hatch.build.targets.wheel]
packages = ["src/anywidget_instruments_aeronautics"]

[tool.hatch.build.hooks.jupyter-builder]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
  "src/anywidget_instruments_aeronautics/static/index.js",
  "src/anywidget_instruments_aeronautics/static/index.css",
  "src/anywidget_instruments_aeronautics/static/contract.json",
]
skip-if-exists = ["src/anywidget_instruments_aeronautics/static/index.js"]
dependencies = ["hatch-jupyter-builder>=0.8"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
npm = ["npm"]
build_cmd = "build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
